<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tethr | Activate Hardware Grayscale</title>
    <link rel="canonical" href="https://www.tethrai.in/activator/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --border-color: #333333;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #ffffff;
            --success: #34C759;
            --error: #FF3B30;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            width: 90%;
            padding: 40px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            background-color: #000;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 12px;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 32px;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: left;
            white-space: pre-wrap;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .success-text { color: var(--success); }
        .error-text { color: var(--error); }

        .app-version-selector {
            margin-bottom: 24px;
            text-align: left;
        }

        .app-version-selector select {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        
        <h1>Tethr Activation</h1>
        <p>Connect your phone via USB. This will grant Tethr the secure permission required to control your screen's hardware grayscale.</p>

        <div class="app-version-selector">
            <label style="color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; display: block;">Select App Version:</label>
            <select id="versionSelect">
                <option value="ai.tethr.app">Commercial Release (ai.tethr.app)</option>
                <option value="ai.tethr.app.debug">Developer/Demo Build (ai.tethr.app.debug)</option>
            </select>
        </div>

        <button id="connectBtn" class="btn">Connect Device</button>

        <div id="statusBox" class="status-box"></div>
    </div>

    <!-- Required implementation for ya-webadb -->
    <script src="/adb_source.js"></script>
    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusBox = document.getElementById('statusBox');
        const versionSelect = document.getElementById('versionSelect');
        let adbInstance = null;

        function log(message, type = 'info') {
            statusBox.style.display = 'block';
            let formattedMsg = message;
            if (type === 'success') formattedMsg = `<span class="success-text">${message}</span>`;
            if (type === 'error') formattedMsg = `<span class="error-text">${message}</span>`;
            statusBox.innerHTML += `> ${formattedMsg}\n`;
            statusBox.scrollTop = statusBox.scrollHeight;
        }

        async function connect() {
            // Reset UI
            statusBox.innerHTML = '';
            connectBtn.disabled = true;
            
            try {
                if (!navigator.usb) {
                    throw new Error("WebUSB is not supported by your browser. Please use Google Chrome or Edge on a desktop/laptop.");
                }

                log("Requesting USB device access...");
                adbInstance = await Adb.open("WebUSB");

                if (!adbInstance) {
                    throw new Error("No device selected or connection failed.");
                }
                
                log("Device connected successfully.", "success");
                log("Connecting to ADB daemon (Check your phone screen for authorization prompt)...");
                
                await adbInstance.connectAdb("host::");
                
                log("ADB daemon authorized.", "success");

                const targetAppId = versionSelect.value;
                const command = `pm grant ${targetAppId} android.permission.WRITE_SECURE_SETTINGS`;
                
                log(`Executing: ${command}`);
                
                const shell = await adbInstance.open('shell:' + command);
                const r = await shell.receive();
                const decoder = new TextDecoder('utf-8');
                const responseText = decoder.decode(r.data);
                
                if (responseText && responseText.toLowerCase().includes('error')) {
                    throw new Error(responseText);
                }

                log("✅ Permission Granted Successfully!", "success");
                log("You can now close this tab and return to the Tethr app.", "success");
                
                connectBtn.textContent = "Granted!";
                
            } catch (error) {
                console.error(error);
                log(`Error: ${error.message}`, "error");
                connectBtn.disabled = false;
                if (connectBtn.textContent !== "Granted!") {
                    connectBtn.textContent = "Retry Connection";
                }
            } finally {
                if (adbInstance) {
                    try {
                        await adbInstance.close();
                    } catch (e) {
                        console.error("Error closing ADB connection", e);
                    }
                }
            }
        }

        connectBtn.addEventListener('click', connect);
    </script>
</body>
</html>
